<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 350px;
        height: 500px;
        font-family: sans-serif;
        padding: 10px;
      }
      .header {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 10px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 5px;
      }
      .chat-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .chat-item {
        padding: 8px;
        border: 1px solid #eee;
        border-radius: 4px;
        cursor: pointer;
      }
      .chat-item:hover {
        background: #f5f5f5;
      }
      .chat-name {
        font-weight: bold;
        font-size: 14px;
      }
      .chat-message {
        font-size: 12px;
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div class="header">Active Conversations</div>
    <div id="list" class="chat-list">
      <div class="chat-item">Loading...</div>
    </div>
    <script>
      // In a real extension, this would fetch from the deployed API URL
      // For demo purposes, we'll mock the data or try to fetch if local
      const API_URL = 'http://localhost:5000/api';

      async function loadChats() {
        try {
          const res = await fetch(`${API_URL}/conversations`);
          const chats = await res.json();
          const list = document.getElementById('list');
          list.innerHTML = '';
          chats.forEach((chat) => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
            <div class="chat-name">${chat.contact.name || 'Unknown'} (${chat.channel})</div>
            <div class="chat-message">Click to open dashboard</div>
          `;
            div.onclick = () => window.open(`http://localhost:5000/`, '_blank');
            list.appendChild(div);
          });
        } catch (e) {
          document.getElementById('list').innerHTML =
            '<div style="color:red">Error connecting to server</div>';
        }
      }
      loadChats();
    </script>
  </body>
</html>
