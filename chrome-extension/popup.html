<!DOCTYPE html>
<html>
  <head>
    <title>WhatsPlatform Admin</title>
    <style>
      body { width: 300px; font-family: sans-serif; padding: 10px; }
      h3 { margin-top: 0; }
      .chat-list { max-height: 400px; overflow-y: auto; }
      .chat-item { border-bottom: 1px solid #ccc; padding: 5px 0; cursor: pointer; }
      .chat-item:hover { background-color: #f0f0f0; }
      .platform { font-weight: bold; font-size: 0.8em; }
    </style>
  </head>
  <body>
    <h3>Active Conversations</h3>
    <div id="loading">Loading...</div>
    <div id="chat-list" class="chat-list"></div>

    <script>
      // Fetch conversations from the API
      fetch('http://localhost:5000/api/admin/conversations')
        .then(response => response.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          const list = document.getElementById('chat-list');
          
          if (data.length === 0) {
            list.innerHTML = '<div>No active conversations</div>';
            return;
          }

          data.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
              <span class="platform">[${chat.platform}]</span> ${chat.externalId}<br/>
              <small>${chat.lastMessage || 'No messages'}</small>
            `;
            list.appendChild(div);
          });
        })
        .catch(err => {
          document.getElementById('loading').innerText = 'Error loading chats';
          console.error(err);
        });
    </script>
  </body>
</html>
